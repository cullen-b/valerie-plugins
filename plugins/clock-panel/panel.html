<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Clock</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-content: center; text-align: center; background: var(--v-bg); color: var(--v-fg); font: 13px/1.3 system-ui, sans-serif; user-select: none; -webkit-user-select: none; cursor: default; }
  #time { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
  #date { color: var(--v-dim); }
</style>
</head>
<body>
<div id="time"></div>
<div id="date"></div>
<script>
  function tick() {
    const now = new Date();
    document.getElementById("time").textContent = now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    document.getElementById("date").textContent = now.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
  }
  tick();
  setInterval(tick, 10000);
</script>
</body>
</html>
