name: Plugins
# Pull requests: check the plugins (and show the reviewer anything they'd run). Main: rebuild index.json.
on:
  pull_request:
  push:
    branches: [main]
    paths: ["plugins/**", "scripts/**", ".github/workflows/index.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: pip install pyyaml
      - name: Check plugins
        if: github.event_name == 'pull_request'
        run: python3 scripts/build_index.py --check
      - name: Rebuild index.json
        if: github.event_name != 'pull_request'
        run: |
          python3 scripts/build_index.py
          if ! git diff --quiet -- index.json || ! git ls-files --error-unmatch index.json >/dev/null 2>&1; then
            git config user.name "valerie-plugins"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.json
            git commit -m "Update index.json"
            git push
          fi
